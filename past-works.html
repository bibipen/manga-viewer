<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff"><title>Past Works</title>
<style>
:root{color-scheme:light;--ink:#222;--muted:#777;--line:#e8e5e1}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 48px}header{padding:12px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}.kicker{font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(28px,6vw,42px);font-weight:600;letter-spacing:.02em;margin:8px 0}.intro{color:var(--muted);font-size:13px;line-height:1.8;margin:0}.section-title{font-size:12px;letter-spacing:.18em;color:#777;margin:26px 0 14px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.card{display:block;min-width:0}.thumb{width:100%;aspect-ratio:3/4;background:#f4f3f1;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #f0eeeb}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{padding:10px;text-align:center;color:#999;font-size:11px;line-height:1.6}.title{font-size:14px;font-weight:600;line-height:1.5;margin:9px 0 3px}.meta{font-size:11px;color:var(--muted)}.card:focus-visible{outline:2px solid #333;outline-offset:4px}footer{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;font-size:11px;color:#888;text-align:center}@media(min-width:620px){.wrap{padding:42px 28px 56px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 22px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><main class="wrap"><header><div class="kicker">Illustration & Manga Archive</div><h1>Past Works</h1><p class="intro">これまでの漫画・イラストをまとめています。<br>作品を選ぶと閲覧ページが開きます。</p></header><div class="section-title">Works / 01—13</div><section class="grid" id="grid" aria-label="過去作品一覧"></section><footer>Past Works Archive</footer></main>
<script>
const works=[
{title:"作品 01",image:"イラスト%2097.PNG",pages:"2ページ"},{title:"作品 02",image:"",pages:"2ページ"},{title:"作品 03",image:"",pages:"2ページ"},{title:"作品 04",image:"",pages:"2ページ"},{title:"作品 05",image:"",pages:"2ページ"},{title:"作品 06",image:"",pages:"2ページ"},{title:"作品 07",image:"",pages:"2ページ"},{title:"作品 08",image:"",pages:"2ページ"},{title:"作品 09",image:"",pages:"2ページ"},{title:"作品 10",image:"",pages:"2ページ"},{title:"作品 11",image:"",pages:"2ページ"},{title:"作品 12",image:"",pages:"2ページ"},{title:"作品 13",image:"",pages:"2ページ"}];
const grid=document.getElementById("grid");works.forEach((work,index)=>{const card=document.createElement("a");card.className="card";card.href=work.href||"#";if(!work.href)card.addEventListener("click",event=>event.preventDefault());const thumb=document.createElement("div");thumb.className="thumb";if(work.image){const img=document.createElement("img");img.src=work.image;img.alt=work.title;img.onerror=()=>{thumb.innerHTML='<div class="placeholder">サムネイル画像を<br>設定してください</div>';};thumb.appendChild(img)}else{const p=document.createElement("div");p.className="placeholder";p.textContent=`WORK ${String(index+1).padStart(2,"0")}`;thumb.appendChild(p)}const title=document.createElement("div");title.className="title";title.textContent=work.title;const meta=document.createElement("div");meta.className="meta";meta.textContent=work.pages||"漫画・イラスト";card.append(thumb,title,meta);grid.appendChild(card)});
</script></body></html>
