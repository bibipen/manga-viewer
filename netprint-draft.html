<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NET PRINT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#f8f5f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
main{width:min(100% - 28px,560px);margin:0 auto;padding:34px 0 48px}header{text-align:center;margin-bottom:24px}
h1{margin:0;font-size:clamp(2.1rem,9vw,3.1rem);letter-spacing:.13em}.instructions{text-align:center;margin:0 auto 26px;font-size:.94rem}
.deadline{display:block;margin-top:5px;color:#d2c7bf}.print-card{background:#fff;color:#171717;border-radius:14px;padding:18px;width:min(100%,390px);margin:0 auto;text-align:center}
.qr-placeholder{width:min(100%,260px);aspect-ratio:1;margin:0 auto 16px;border:2px dashed #777;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:16px}
.qr-symbol{font-size:4.5rem;line-height:1}.qr-placeholder small{font-size:.8rem;color:#555}.label{font-size:.85rem;color:#555;margin-bottom:2px}
.number{font-size:clamp(1.4rem,6vw,1.9rem);font-weight:800;letter-spacing:.08em}.shared{color:#555;font-size:.8rem;margin-top:4px}
</style></head><body><main>
<header><h1>NET PRINT</h1></header>
<p class="instructions">スクショ保存がオススメ！<br>ローソンorファミマにて印刷お願いします。<span class="deadline">〜11/◯</span></p>
<section class="print-card" aria-label="3点共通のネットプリント情報">
<div class="qr-placeholder"><span class="qr-symbol">▦</span><strong>QRコードをここに配置</strong><small>実際のQRコード画像に差し替え</small></div>
<div class="label">ユーザー番号</div><div class="number">XXXXXXXX</div><div class="shared">3点共通</div>
</section></main></body></html>
