<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Manga Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#080808; --fg:#f5f5f5; --muted:#a8a8a8; --line:#383838; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { min-height:100dvh; overflow:hidden; }
    .app { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); gap:10px; }
    header, footer { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-size:11px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }
    .counter { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .stage { min-height:0; display:flex; align-items:center; justify-content:center; position:relative; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
    .page { display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow:0 0 0 1px #202020; -webkit-user-drag:none; }
    .nav { appearance:none; border:1px solid var(--line); background:#111; color:var(--fg); border-radius:999px; min-width:44px; height:40px; padding:0 14px; font-size:20px; cursor:pointer; }
    .nav:disabled { opacity:.25; cursor:default; }
    .footer-left { display:flex; align-items:center; gap:10px; }
    .hint { font-size:11px; color:var(--muted); }
    .progress { position:absolute; bottom:-5px; left:0; right:0; height:2px; background:#222; }
    .bar { height:100%; width:12.5%; background:#eee; transition:width .18s ease; }
    .error { max-width:28rem; padding:20px; border:1px solid #444; color:#ddd; line-height:1.7; font-size:14px; }
    @media (min-width:700px) { .app { padding-left:24px; padding-right:24px; } .page { max-width:min(100%, 760px); } }
  </style>
</head>
<body>
  <main class="app" aria-label="漫画ビューア">
    <header>
      <div class="brand">MANGA / READ</div>
      <div class="counter" id="counter">01 / 08</div>
    </header>
    <section class="stage" id="stage" aria-label="漫画ページ">
      <img class="page" id="page" src="images/page01.jpg" alt="漫画 1ページ目" draggable="false">
      <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
    </section>
    <footer>
      <div class="footer-left">
        <button class="nav" id="prev" type="button" aria-label="前のページ">‹</button>
        <button class="nav" id="next" type="button" aria-label="次のページ">›</button>
      </div>
      <div class="hint">SWIPE TO READ</div>
    </footer>
  </main>
  <script>
    // Replace these eight image files with your manga pages, keeping the filenames.
    const pages = Array.from({ length: 8 }, (_, i) => `images/page${String(i + 1).padStart(2, '0')}.jpg`);
    let current = 0;
    const img = document.getElementById('page');
    const counter = document.getElementById('counter');
    const bar = document.getElementById('bar');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');

    function showPage(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      img.src = pages[current];
      img.alt = `漫画 ${current + 1}ページ目`;
      counter.textContent = `${String(current + 1).padStart(2, '0')} / ${String(pages.length).padStart(2, '0')}`;
      bar.style.width = `${((current + 1) / pages.length) * 100}%`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
      document.title = `Manga ${current + 1} / ${pages.length}`;
    }
    prev.addEventListener('click', () => showPage(current - 1));
    next.addEventListener('click', () => showPage(current + 1));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showPage(current - 1);
      if (event.key === 'ArrowRight' || event.key === ' ') { event.preventDefault(); showPage(current + 1); }
    });

    const stage = document.getElementById('stage');
    let startX = 0, startY = 0;
    stage.addEventListener('touchstart', (event) => {
      const touch = event.changedTouches[0]; startX = touch.clientX; startY = touch.clientY;
    }, { passive: true });
    stage.addEventListener('touchend', (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX; const dy = touch.clientY - startY;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        // Swipe left = next page; swipe right = previous page.
        showPage(current + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    img.addEventListener('error', () => {
      const box = document.createElement('div');
      box.className = 'error';
      box.innerHTML = '<strong>漫画画像が見つかりません。</strong><br>images フォルダに page01.jpg ～ page08.jpg を入れてください。<br>ファイル名と大文字・小文字も確認してください。';
      img.replaceWith(box);
    }, { once: true });
    showPage(0);
  </script>
</body>
</html>
