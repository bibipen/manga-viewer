<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NET PRINT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#f8f5f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
main{width:min(100% - 28px,620px);margin:0 auto;padding:30px 0 48px}
header{text-align:center;margin-bottom:18px}
h1{margin:0;font-size:clamp(2.1rem,9vw,3.1rem);letter-spacing:.13em}
.lead{text-align:center;margin:0 auto 26px;font-size:.95rem}
.lead p{margin:4px 0}.deadline{display:block;margin-top:8px;color:#d8bca1;font-weight:700;letter-spacing:.06em}
h2{text-align:center;font-size:1rem;letter-spacing:.12em;font-weight:600;margin:28px 0 14px}
.gallery{display:grid;grid-template-columns:1fr;gap:16px}
.art{margin:0;background:#282321;border:1px solid #51443c;border-radius:12px;padding:10px;text-align:center}
.art img{display:block;width:100%;height:auto;max-height:680px;object-fit:contain;border-radius:6px}
.art figcaption{font-size:.82rem;color:#d9cec6;padding:8px 0 1px;letter-spacing:.08em}
.print-card{background:#fff;color:#171717;border-radius:14px;padding:16px;width:min(100%,390px);margin:0 auto;text-align:center}
.qr{display:block;width:100%;height:auto;margin:0 auto 12px}
.label{font-size:.85rem;color:#555;margin-bottom:2px}.number{font-size:clamp(1.4rem,6vw,1.9rem);font-weight:800;letter-spacing:.08em;overflow-wrap:anywhere}
.shared{color:#555;font-size:.8rem;margin-top:4px}
.note{text-align:center;font-size:.88rem;color:#d9cec6;margin:16px auto 0}
@media(min-width:520px){.gallery{grid-template-columns:1fr 1fr}.art:first-child{grid-column:1/-1}.art:first-child img{max-height:720px}}
</style>
</head>
<body>
<main>
<header><h1>NET PRINT</h1></header>
<section class="lead">
<p>スクリーンショット保存がおすすめ！</p>
<p>ローソン・ファミリーマートにて印刷できます。</p>
<p>フチあり印刷推奨です。</p>
<p>フチなしは端が切れてしまいますが、より迫力のある仕上がりになるかも！</p>
<span class="deadline">印刷期限：11月6日まで</span>
</section>
<h2>PRINTABLE ILLUSTRATIONS</h2>
<section class="gallery" aria-label="印刷できるイラスト">
<figure class="art"><img src="netprint-01.jpg" alt="印刷見本 1"><figcaption>PRINT 01</figcaption></figure>
<figure class="art"><img src="netprint-02.jpg" alt="印刷見本 2"><figcaption>PRINT 02</figcaption></figure>
<figure class="art"><img src="netprint-03.jpg" alt="印刷見本 3"><figcaption>PRINT 03</figcaption></figure>
</section>
<h2>HOW TO PRINT</h2>
<section class="print-card" aria-label="ネットプリント情報">
<img class="qr" src="netprint-qr.jpg" alt="ネットプリントのQRコード">
<div class="label">ユーザー番号</div>
<div class="number">5PPMTXA2KQ</div>
<div class="shared">3点共通</div>
</section>
<p class="note">QRコードまたはユーザー番号をご利用ください。</p>
</main>
</body>
</html>
