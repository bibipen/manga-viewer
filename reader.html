<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff"><title>漫画を読む</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top a{color:#555;text-decoration:none;font-size:14px}.title{font-size:20px;font-weight:600;text-align:center;flex:1}.count{text-align:center;color:#777;font-size:13px;margin:10px 0 16px}.page{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);object-fit:contain;margin:auto}.controls{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px}.controls button{border:1px solid #ddd;background:white;border-radius:24px;padding:10px 20px;font-size:15px;color:#222}.controls button:disabled{opacity:.3}.hint{text-align:center;font-size:12px;color:#888;margin-top:10px}
</style></head><body><main class="wrap"><div class="top"><a href="past-works.html">← 作品一覧</a><div class="title" id="title">漫画</div><span style="width:58px"></span></div><div class="count" id="count"></div><img class="page" id="page" alt="漫画ページ"><div class="controls"><button id="prev">前へ</button><button id="next">次へ</button></div><div class="hint">左右のボタンでページをめくれます</div></main>
<script>
const data={
1:{title:"おねだり",pages:["イラスト97.PNG","イラスト97 2.PNG"]},
2:{title:"涙",pages:["イラスト99.PNG","涙2.PNG"]},
3:{title:"キス",pages:["イラスト105.PNG","イラスト106.PNG"]},
4:{title:"おにぎり",pages:["イラスト101.PNG","イラスト101 2.PNG"]}
};
const id=Number(new URLSearchParams(location.search).get("work"))||1;
const work=data[id]||data[1];let current=0;
const title=document.getElementById("title"),page=document.getElementById("page"),count=document.getElementById("count"),prev=document.getElementById("prev"),next=document.getElementById("next");
title.textContent=work.title;document.title=work.title;
function render(){page.src=encodeURI(work.pages[current]);count.textContent=(current+1)+" / "+work.pages.length;prev.disabled=current===0;next.disabled=current===work.pages.length-1}
prev.onclick=()=>{if(current>0){current--;render()}};next.onclick=()=>{if(current<work.pages.length-1){current++;render()}};render();
</script></body></html>
