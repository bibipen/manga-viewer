<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff"><title>漫画を読む</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top a{color:#555;text-decoration:none;font-size:14px}.title{font-size:20px;font-weight:600;text-align:center;flex:1}.count{text-align:center;color:#777;font-size:13px;margin:10px 0 16px;min-height:18px}.stage{width:100%;min-height:180px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}.page{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);object-fit:contain;margin:auto;opacity:1;transition:opacity .1s ease;pointer-events:none}.page.loading{opacity:.35}.controls{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px}.controls button{border:1px solid #ddd;background:white;border-radius:24px;padding:10px 20px;font-size:15px;color:#222}.controls button:disabled{opacity:.3}.hint{text-align:center;font-size:12px;color:#888;margin-top:10px}
</style></head><body><main class="wrap"><div class="top"><a href="past-works.html">← 作品一覧</a><div class="title" id="title">漫画</div><span style="width:58px"></span></div><div class="count" id="count"></div><div class="stage" id="stage" aria-label="漫画ページ。左右にスワイプまたはドラッグしてページをめくれます"><img class="page" id="page" alt="漫画ページ" decoding="async" fetchpriority="high"></div><div class="controls"><button id="prev">前へ</button><button id="next">次へ</button></div><div class="hint">左右にスワイプ／ドラッグしてページをめくれます</div></main>
<script>
const data={
  1:{title:'おねだり',pages:['イラスト97.PNG', 'イラスト97 2.PNG']},
  2:{title:'涙',pages:['イラスト99.PNG', '涙2.PNG']},
  3:{title:'シガーキス',pages:['イラスト104-kiss.PNG', 'イラスト105.PNG', 'イラスト106.PNG']},
  4:{title:'おにぎり',pages:['イラスト101.PNG', 'イラスト101 2.PNG']},
  5:{title:'海の日',pages:['海の日1.PNG','海の日2.PNG','ウォーターバトル.PNG']},  6:{title:'狸寝入り1',pages:['狸寝入り1-1.PNG', '狸寝入り1-2.PNG']},
  7:{title:'現パエース',pages:['現パエース.PNG']},
  8:{title:'ハグの日',pages:['ハグの日_0.png', 'ハグの日2.png']},
  9:{title:'バニー',pages:['バニー2.png', 'バニー1.png']},
  10:{title:'残暑見舞い',pages:['残暑見舞い1.PNG', '残暑見舞い2.PNG']},
  11:{title:'狸寝入り2',pages:['狸寝入り2-1.png', '狸寝入り2-2.png']},
  12:{title:'誕生日漫画',pages:['誕生日漫画1.png', '誕生日漫画2.png']},
  13:{title:'学パロセプテンバー',pages:['学パロセプテンバー.png']}
};
const id=Number(new URLSearchParams(location.search).get('work'))||1;
const work=data[id]||data[1];let current=0;const cache=new Map();
const title=document.getElementById('title'),page=document.getElementById('page'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage');
title.textContent=work.title;document.title=work.title;
function urlFor(i){return encodeURI(work.pages[i]).replaceAll('#','%23')}
function preload(i){if(i<0||i>=work.pages.length)return Promise.resolve(null);if(cache.has(i))return cache.get(i);const promise=new Promise((resolve,reject)=>{const img=new Image();img.decoding='async';img.onload=async()=>{try{if(img.decode)await img.decode()}catch(e){}resolve(img)};img.onerror=reject;img.src=urlFor(i)});cache.set(i,promise);return promise}
function updateControls(){count.textContent=(current+1)+' / '+work.pages.length;prev.disabled=current===0;next.disabled=current===work.pages.length-1}
let request=0;
async function show(i){if(i<0||i>=work.pages.length||i===current&&page.src)return;const thisRequest=++request;current=i;updateControls();page.classList.add('loading');try{const loaded=await preload(i);if(thisRequest!==request)return;if(!loaded)throw new Error('missing');page.src=loaded.src;page.alt=work.title+' '+(i+1)+'ページ';page.classList.remove('loading');}catch(e){if(thisRequest!==request)return;page.classList.remove('loading');page.alt='画像を読み込めません。ファイル名を確認してください';count.textContent='画像を読み込めません。';}finally{if(thisRequest===request)updateControls()}preload(current+1).catch(()=>{});preload(current-1).catch(()=>{});}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);
let startX=null,startY=null,pointerId=null;
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;pointerId=e.pointerId;try{stage.setPointerCapture(pointerId)}catch(_){}},{passive:true});
stage.addEventListener('pointerup',e=>{if(startX===null)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.15){if(dx<0)show(current+1);else show(current-1)}startX=null;startY=null;pointerId=null},{passive:true});
stage.addEventListener('pointercancel',()=>{startX=null;startY=null;pointerId=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
show(0);
</script></body></html>
